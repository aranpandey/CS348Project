<!DOCTYPE html>
<html>
<head><title>Update User</title></head>
<body>
    <h1>Update User: {{ user.username }}</h1>
    <form method="POST">
        Email: {{ user.email }} (read-only)<br><br>
        Age: <input type="number" name="age" value="{{ user.age }}" required><br><br>
        Weight (kg): <input type="number" step="0.1" name="weight_kg" value="{{ user.weight_kg }}" required><br><br>
        <button type="submit">Update User</button>
    </form>
    {% if message %}<p style="color: green;">{{ message }}</p>{% endif %}
    <br><a href="/users">← Back to Users</a>
</body>
</html>
