<!DOCTYPE html>
<html>
<head><title>Add Exercise</title></head>
<body>
    <h1>Add New Exercise</h1>
    <p><em>After adding, this exercise will automatically appear in workout dropdowns!</em></p>
    
    <form method="POST">
        Exercise Name: <input type="text" name="exercise_name" required><br><br>
        Category: 
        <select name="category" required>
            <option value="cardio">Cardio</option>
            <option value="strength">Strength</option>
            <option value="flexibility">Flexibility</option>
            <option value="core">Core</option>
        </select><br><br>
        Calories/Min: <input type="number" step="0.1" name="calories_per_minute" required><br><br>
        Description: <textarea name="description"></textarea><br><br>
        <button type="submit">Add Exercise</button>
    </form>
    <br><a href="/workouts/add">← Back to Add Workout</a>
</body>
</html>
